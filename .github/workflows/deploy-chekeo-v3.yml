name: 🔐 Deploy Internal Chekeo V3

on:
  push:
    branches: [v3, preview]
  pull_request:
    branches: [v3, preview]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy → burgers-exe-internal-v3
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Internal Chekeo V3
        run: npm run build:chekeo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/internal-chekeo-v3 --project-name=burgers-exe-internal-v3

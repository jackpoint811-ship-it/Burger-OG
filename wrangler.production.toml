name = "burgers-exe-v3-production"
compatibility_date = "2026-05-27"
main = "functions/api/[[route]].ts"

[[d1_databases]]
binding = "BOG_MENU_DB"
database_name = "burgers-exe-menu-v2"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"

[[r2_buckets]]
binding = "BOG_MENU_ASSETS"
bucket_name = "burgers-exe-assets-v2"

[vars]
ENVIRONMENT = "production"
ORDERS_V2_WRITE_ENABLED = "true"


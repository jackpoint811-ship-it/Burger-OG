name = "amsi-tortas-public-preview"
compatibility_date = "2026-05-27"
main = "functions/api/[[route]].ts"

[[d1_databases]]
binding = "BOG_MENU_DB"
database_name = "amsi-tortas-menu-preview"
database_id = "amsi-tortas-preview-d1-placeholder-id"

[[r2_buckets]]
binding = "BOG_MENU_ASSETS"
bucket_name = "amsi-tortas-assets-preview"

[vars]
ENVIRONMENT = "preview"
ORDERS_V2_WRITE_ENABLED = "true"
APP_TENANT = "amsi-tortas"
